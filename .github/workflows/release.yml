name: Release Multi-Platform Installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release Version Tag"
        required: true
        default: "v1.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: ""
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            args: ""
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev build-essential curl wget file

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Tauri Application & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.version || github.ref_name || 'v1.0.0' }}
          releaseName: "Android Virtual Device Launcher Pro ${{ github.event.inputs.version || github.ref_name || 'v1.0.0' }}"
          args: ${{ matrix.args }}
          releaseBody: |
            ### 🚀 Android Virtual Device Launcher Pro v1.0.0
            
            Welcome to the official release of **Android Virtual Device Launcher Pro** — the next-generation desktop emulator studio and ADB device control manager built with Rust, Tauri v2, and React 19.

            #### 📦 Download Platform Binaries:
            - **Windows**: `.msi` (Installer) and `.exe` (Standalone)
            - **macOS**: `.dmg` (Apple Silicon & Intel)
            - **Linux**: `.deb` (Debian/Ubuntu) and `.AppImage` (Universal Linux)

            #### ✨ Release Highlights:
            - **Zero Black Console Windows**: Native `CREATE_NO_WINDOW` background process execution.
            - **100% Emulator CLI Flag Suite**: Boot, Display, GPU (Vulkan/ANGLE/SwiftShader), Audio, Network (Speed/Latency), SELinux.
            - **Live Device Studio**: Root verification, partition remount, direct APK install, screen capture, virtual controller, text typing, ADB shell runner, and file push.
            - **Streaming Logcat**: Real-time severity filters, PID resolution, package filter, and export.
            - **Hardware & Launch Presets**: Instant profile switcher and line-preserving `config.ini` editor with automated backups.
          releaseDraft: false
          prerelease: false
